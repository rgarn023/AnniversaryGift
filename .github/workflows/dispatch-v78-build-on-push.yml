name: Dispatch Chest v78 Build

on:
  push:
    branches:
      - cursor/v74-auth-recovery-google-signin
    paths:
      - .github/workflows/dispatch-v78-build-on-push.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-v78:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android build workflow on v78 branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-chest-of-love-notes-android.yml/dispatches" \
            -d '{"ref":"cursor/v74-auth-recovery-google-signin"}'
          echo "Dispatched v78 Android build."
